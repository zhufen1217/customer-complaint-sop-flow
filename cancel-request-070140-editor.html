(()=>{const key=document.body.dataset.storageKey,hits=[...document.querySelectorAll('.hit')],canvas=document.querySelector('#canvas'),box=document.querySelector('#editor'),input=document.querySelector('#nodeText'),original=document.querySelector('#original'),status=document.querySelector('#saveStatus');let selected,edits={};try{edits=JSON.parse(localStorage.getItem(key))||{}}catch{}const clean=t=>t.replace(/&#10;/g,'\n');function placement(hit,text){const old=canvas.querySelector('[data-overlay="'+hit.dataset.node+'"]');if(old)old.remove();if(!text)return;const r=hit.getBoundingClientRect(),c=canvas.getBoundingClientRect(),el=document.createElement('div');el.dataset.overlay=hit.dataset.node;el.className='edit-label'+(hit.classList.contains('d')?' decision':'');el.style.left=(r.left-c.left)+'px';el.style.top=(r.top-c.top)+'px';el.style.width=r.width+'px';el.style.height=r.height+'px';const s=document.createElement('span');s.textContent=text;el.append(s);canvas.append(el)}function apply(){hits.forEach(h=>placement(h,edits[h.dataset.node]))}apply();hits.forEach(h=>{h.setAttribute('aria-label',clean(h.dataset.text));h.onclick=()=>{selected=h;original.textContent=clean(h.dataset.text);input.value=edits[h.dataset.node]||clean(h.dataset.text);box.hidden=false;input.focus()}});document.querySelector('#cancel').onclick=()=>{selected=null;box.hidden=true};document.querySelector('#save').onclick=()=>{if(!selected||!input.value.trim())return;edits[selected.dataset.node]=input.value.trim();localStorage.setItem(key,JSON.stringify(edits));placement(selected,edits[selected.dataset.node]);status.textContent='已自动保存';box.hidden=true};document.querySelector('#resetButton').onclick=()=>{if(confirm('确认清除本地文字修改并恢复原始 PNG？')){localStorage.removeItem(key);location.reload()}};document.querySelector('#exportButton').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,edits},null,2)],{type:'application/json'}));a.download='订单取消与退款流程图-文字修改.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#importInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x.edits!=='object'||Array.isArray(x.edits))throw Error();localStorage.setItem(key,JSON.stringify(x.edits));location.reload()}catch{alert('无法读取此 JSON 文件。')}e.target.value=''};r.readAsText(f,'utf-8')};document.querySelector('#pdfButton').onclick=()=>window.print()})();
</script></body></html>
