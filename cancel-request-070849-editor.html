<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单取消与退款流程图（完整版）</title><link rel="stylesheet" href="flow-shell.css"><style>body{background:#050505}.canvas{width:1850px;height:1180px;min-width:1850px;background:#fff}.source{display:block;width:1850px;height:1180px}.hit{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer}.hit:hover,.hit:focus-visible{outline:3px solid #52a9f2;outline-offset:2px}.edit-label{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:4px 7px;color:#151515;background:#f2f2ff;border:1px solid #aaa;font:13px/1.25 "Microsoft YaHei",Arial,sans-serif;white-space:pre-line}.editor p{line-height:1.5}.original{font-size:11px;color:#657282;white-space:pre-line;background:#f3f6f9;padding:7px;border:1px solid #d6dee7}.toolbar .pdf{background:#1f5e96;border-color:#1f5e96}@media print{header,.editor{display:none!important}body{background:#fff}.canvas{margin:0;transform:none}.hit{display:none}}</style></head><body data-storage-key="cancel-request-070849-image-style-edits-v1"><header><h1>订单取消与退款流程图（完整版）</h1><span class="sub">原图未作任何内容或版式改动；点击节点可编辑文字，导出 PDF 保留当前图形版式。</span><a class="back" href="index.html">返回总 SOP</a><div class="toolbar"><button id="pdfButton" class="pdf">导出 PDF</button><button id="exportButton">导出 JSON</button><label class="file-button">导入 JSON<input id="importInput" type="file" accept="application/json"></label><button id="resetButton">重置</button><span class="status" id="saveStatus">尚未修改</span></div></header><main class="canvas" id="canvas"><img class="source" src="cancel-request-070849-source.png" alt="订单取消与退款流程图完整版原图"></main><aside class="editor" id="editor" hidden><h2>编辑节点</h2><p>保存后只会在当前节点位置覆盖新文字；重置将回到完全原始的 PNG。</p><label>原始文字</label><div id="original" class="original"></div><label for="nodeText">节点文字</label><textarea id="nodeText" maxlength="300"></textarea><div class="actions"><button id="cancel">取消</button><button class="save" id="save">保存</button></div></aside><script>
(()=>{const nodes=[['start','买家发起取消或退款请求',870,2,125,25],['status','订单状态判断',840,52,125,125],['pending','24小时内响应处理',690,250,110,28],['label','物流标签状态',685,350,72,72],['seller-cancel','卖家取消操作',445,500,150,52],['buyer-cancel','买家自行取消',625,500,150,52],['late-ship','延迟发货处理',920,500,150,52],['fba','FBA订单处理',1135,500,150,52],['address','地址不完整或错误',1335,500,150,52],['carrier','承运商/物流异常',1540,500,150,52],['refund','退款处理',810,750,145,55],['ledger','记录台账 → 关闭工单',1025,925,155,42],['monthly','月度复盘看板',1040,1010,130,35],['metric1','取消率监控',700,1115,150,45],['metric2','迟发率监控',930,1115,150,45],['metric3','退款与索赔复盘',1160,1115,150,45],['metric4','SOP持续改进',1405,1115,150,45],['return','退货到仓验收',555,760,130,70],['inspection','商品完好与配件核验',555,870,130,70],['stock','库存回滚与同步',360,925,150,48],['case','向承运商开Case',1515,700,150,48],['guarantee','A-to-Z Guarantee 索赔',1660,825,160,48],['address-check','买家地址是否正确',1325,650,115,80],['ship-decision','是否可补救',1515,300,105,80],['buyer-choice','买家方案选择',675,630,105,80],['refund-decision','退款是否完成',1030,835,105,80],['fba-note','FBA由亚马逊处理',1130,650,150,50],['tracking','查Tracking轨迹',1535,585,150,48],['refund-fast','优先退款再向承运商追偿',1545,805,170,55],['cancel-rate','Cancellation Rate 风险预警',1210,925,180,45],['evidence','拍照留证并提交申诉',400,825,160,50],['return-label','标准退货/预付退货标签',620,710,155,45],['normal-ship','正常发货并记录沟通',1195,750,170,48],['support','联系买家协商替代方案',850,585,165,48]];const key=document.body.dataset.storageKey,canvas=document.querySelector('#canvas'),box=document.querySelector('#editor'),input=document.querySelector('#nodeText'),original=document.querySelector('#original'),status=document.querySelector('#saveStatus');let selected,edits={};try{edits=JSON.parse(localStorage.getItem(key))||{}}catch{}function overlay(h,text){const old=canvas.querySelector('[data-overlay="'+h.dataset.node+'"]');if(old)old.remove();if(!text)return;const el=document.createElement('div');el.dataset.overlay=h.dataset.node;el.className='edit-label';el.style.cssText=`left:${h.offsetLeft}px;top:${h.offsetTop}px;width:${h.offsetWidth}px;height:${h.offsetHeight}px`;el.textContent=text;canvas.append(el)}nodes.forEach(([id,text,x,y,w,h])=>{const b=document.createElement('button');b.className='hit';b.dataset.node=id;b.dataset.text=text;b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.setAttribute('aria-label',text);canvas.append(b);if(edits[id])overlay(b,edits[id]);b.onclick=()=>{selected=b;original.textContent=b.dataset.text;input.value=edits[id]||b.dataset.text;box.hidden=false;input.focus()}});document.querySelector('#cancel').onclick=()=>{box.hidden=true;selected=null};document.querySelector('#save').onclick=()=>{if(!selected||!input.value.trim())return;edits[selected.dataset.node]=input.value.trim();localStorage.setItem(key,JSON.stringify(edits));overlay(selected,edits[selected.dataset.node]);status.textContent='已自动保存';box.hidden=true};document.querySelector('#resetButton').onclick=()=>{if(confirm('确认清除本地文字修改并恢复原始 PNG？')){localStorage.removeItem(key);location.reload()}};document.querySelector('#exportButton').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,edits},null,2)],{type:'application/json'}));a.download='订单取消与退款流程图完整版-文字修改.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#importInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x.edits!=='object'||Array.isArray(x.edits))throw Error();localStorage.setItem(key,JSON.stringify(x.edits));location.reload()}catch{alert('无法读取此 JSON 文件。')}e.target.value=''};r.readAsText(f,'utf-8')};document.querySelector('#pdfButton').onclick=()=>window.print()})();
</script></body></html>
