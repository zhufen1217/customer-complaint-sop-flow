<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业内部组织框架图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#202b2c;font:14px/1.45 "Microsoft YaHei","PingFang SC",sans-serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 26px;background:white;border-bottom:1px solid #d9dfdb}h1{margin:0;font-size:20px}.description{flex:1;min-width:180px;color:#687575;font-size:13px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.file-button{font:inherit;cursor:pointer}.toolbar button,.file-button,.actions button{padding:7px 10px;border:1px solid #a3aeaa;background:#fff;border-radius:4px;color:#263432}.toolbar button:hover,.file-button:hover{background:#edf3ef}.file-button input{display:none}#saveStatus{color:#687575;font-size:12px}main{padding:24px}.sheet{max-width:1500px;margin:auto;background:white;border:1px solid #dce2dd;overflow:auto}.chart{width:1400px;height:850px;position:relative;margin:auto;background:#fff}.chart-title{position:absolute;left:55px;top:42px;font-size:29px;font-weight:700}.wire{position:absolute;z-index:0;background:#3e4241}.h{height:2px}.v{width:2px}.arrow:after{content:"";position:absolute;bottom:-1px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #3e4241}.node{position:absolute;z-index:1;width:174px;height:72px;border:3px solid #b39237;border-radius:12px;background:#fffdf7;color:#1c2422;display:flex;justify-content:center;align-items:center;padding:18px 10px 8px;text-align:center;font-size:17px;line-height:1.2}.node:hover{background:#fff8df}.node:focus-visible,.node.selected{outline:3px solid #246a91;outline-offset:3px}.node span{display:block;overflow-wrap:anywhere}.avatar{position:absolute;width:48px;height:48px;top:-25px;left:60px;border:3px solid #b39237;border-radius:50%;background:#fffdf7;display:grid;place-items:center}.avatar svg{width:36px;height:36px}.editor{position:fixed;z-index:5;right:16px;top:16px;width:min(380px,calc(100vw - 32px));background:#fff;padding:18px;border:1px solid #b8c5c0;box-shadow:0 10px 30px #0003}.editor[hidden]{display:none}.editor h2{font-size:18px;margin:0 0 12px}.editor label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.editor input{width:100%;font:inherit;padding:9px;border:1px solid #9caaa4;border-radius:4px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions .save{background:#23678e;color:white;border-color:#23678e}@media(max-width:700px){header{padding:14px 16px}.description{flex-basis:100%;order:3}main{padding:12px 0}.sheet{border-left:0;border-right:0}.chart{transform-origin:top left}}@media print{@page{size:A3 landscape;margin:10mm}header,.editor{display:none!important}body{background:#fff}main{padding:0}.sheet{border:0;overflow:visible}.chart{transform-origin:top left}}
</style>
</head>
<body>
<header><h1>企业内部组织框架图</h1><span class="description">点击岗位名称编辑，修改自动保存在当前浏览器。</span><div class="toolbar"><button type="button" id="exportButton">导出 JSON</button><label class="file-button">导入 JSON<input id="importInput" type="file" accept="application/json,.json"></label><button type="button" id="printButton">打印 / 保存 PDF</button><button type="button" id="resetButton">重置</button><span id="saveStatus" aria-live="polite">尚未修改</span></div></header>
<main><div class="sheet"><div class="chart" id="chart" aria-label="企业内部组织框架图">
<div class="chart-title">企业内部组织框架图</div>
<div class="wire v arrow" style="left:699px;top:190px;height:68px"></div>
<div class="wire v" style="left:699px;top:340px;height:45px"></div><div class="wire h" style="left:195px;top:385px;width:1010px"></div><div class="wire v arrow" style="left:195px;top:385px;height:54px"></div><div class="wire v arrow" style="left:699px;top:385px;height:199px"></div><div class="wire v arrow" style="left:1204px;top:385px;height:54px"></div>
<div class="wire v" style="left:195px;top:520px;height:50px"></div><div class="wire h" style="left:104px;top:570px;width:242px"></div><div class="wire v arrow" style="left:104px;top:570px;height:44px"></div><div class="wire v arrow" style="left:346px;top:570px;height:44px"></div>
<div class="wire v" style="left:1204px;top:520px;height:50px"></div><div class="wire h" style="left:1054px;top:570px;width:242px"></div><div class="wire v arrow" style="left:1054px;top:570px;height:44px"></div><div class="wire v arrow" style="left:1296px;top:570px;height:44px"></div>
<div class="wire v arrow" style="left:104px;top:686px;height:48px"></div><div class="wire v arrow" style="left:346px;top:686px;height:48px"></div><div class="wire v arrow" style="left:699px;top:686px;height:48px"></div><div class="wire v arrow" style="left:1054px;top:686px;height:48px"></div><div class="wire v arrow" style="left:1296px;top:686px;height:48px"></div>
<button class="node person" data-node="chairman" style="left:612px;top:118px" type="button"><span>董事长</span></button>
<button class="node person" data-node="director" style="left:612px;top:268px" type="button"><span>客服总监</span></button>
<button class="node person" data-node="manager-one" style="left:108px;top:448px" type="button"><span>客服经理-1部</span></button>
<button class="node person" data-node="manager-two" style="left:1117px;top:448px" type="button"><span>客服经理-2部</span></button>
<button class="node person" data-node="supervisor-one" style="left:17px;top:614px" type="button"><span>客服主管</span></button>
<button class="node person" data-node="supervisor-two" style="left:259px;top:614px" type="button"><span>客服主管</span></button>
<button class="node person" data-node="supervisor-middle" style="left:612px;top:614px" type="button"><span>客服主管</span></button>
<button class="node person" data-node="supervisor-four" style="left:967px;top:614px" type="button"><span>客服主管</span></button>
<button class="node person" data-node="supervisor-five" style="left:1209px;top:614px" type="button"><span>客服主管</span></button>
<button class="node" data-node="service-one" style="left:17px;top:734px" type="button"><span>客服</span></button>
<button class="node" data-node="service-two" style="left:259px;top:734px" type="button"><span>客服</span></button>
<button class="node" data-node="service-middle" style="left:612px;top:734px" type="button"><span>客服+客服助理</span></button>
<button class="node" data-node="service-four" style="left:967px;top:734px" type="button"><span>客服</span></button>
<button class="node" data-node="service-five" style="left:1209px;top:734px" type="button"><span>客服</span></button>
</div></div></main>
<aside class="editor" id="editor" hidden><h2>编辑岗位</h2><label for="nodeText">岗位名称</label><input id="nodeText" maxlength="30" autocomplete="off"><div class="actions"><button type="button" id="cancel">取消</button><button type="button" class="save" id="save">保存</button></div></aside>
<script>
(()=>{const key='customer-service-org-chart-edits-v1',nodes=[...document.querySelectorAll('[data-node]')],box=document.querySelector('#editor'),input=document.querySelector('#nodeText'),status=document.querySelector('#saveStatus'),defaults=Object.fromEntries(nodes.map(n=>[n.dataset.node,n.querySelector('span').textContent]));let selected=null,edits={};const valid=x=>x&&typeof x==='object'&&!Array.isArray(x)&&Object.entries(x).every(([k,v])=>Object.hasOwn(defaults,k)&&typeof v==='string'&&v.trim()&&v.length<=30);try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(valid(saved))edits=saved}catch{}const render=()=>nodes.forEach(n=>{n.querySelector('span').textContent=edits[n.dataset.node]??defaults[n.dataset.node]});const persist=()=>{try{localStorage.setItem(key,JSON.stringify(edits));status.textContent='已自动保存';return true}catch{status.textContent='本地保存失败';alert('浏览器无法保存数据，请检查存储权限并导出 JSON 备份。');return false}};const close=()=>{if(selected)selected.classList.remove('selected');selected=null;box.hidden=true};nodes.forEach(n=>{if(n.classList.contains('person')){const avatar=document.createElement('i');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.innerHTML='<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="13" r="7" fill="#c8a378"/><path d="M11 12c0-6 3-9 7-9s7 3 7 9c-2-1-3-3-4-4-3 2-6 3-10 4z" fill="#5d4938"/><path d="M5 34c1-9 5-13 13-13s12 4 13 13" fill="#384e52"/><path d="M14 22l4 6 4-6" fill="#f8f5e9"/></svg>';n.prepend(avatar)}n.addEventListener('click',()=>{if(selected)selected.classList.remove('selected');selected=n;n.classList.add('selected');input.value=n.querySelector('span').textContent;box.hidden=false;input.focus();input.select()})});render();document.querySelector('#cancel').onclick=close;document.querySelector('#save').onclick=()=>{if(!selected||!input.value.trim())return;edits[selected.dataset.node]=input.value.trim();render();persist();close()};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('#save').click()}else if(e.key==='Escape')close()});document.querySelector('#resetButton').onclick=()=>{if(confirm('确认清除本浏览器保存的组织架构修改？')){try{localStorage.removeItem(key);edits={};render();close();status.textContent='已恢复原图文字'}catch{alert('无法清除本地数据。')}}};document.querySelector('#printButton').onclick=()=>window.print();document.querySelector('#exportButton').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,kind:'customer-service-org-chart',exportedAt:new Date().toISOString(),edits},null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='customer-service-org-chart-edits.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};document.querySelector('#importInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||data.version!==1||data.kind!=='customer-service-org-chart'||!valid(data.edits))throw Error();if(confirm('导入将覆盖当前本地修改，是否继续？')){edits=data.edits;render();persist();close()}}catch{alert('无法读取该 JSON 文件，请选择本页面导出的文件。')}e.target.value=''};reader.onerror=()=>{alert('读取文件失败。');e.target.value=''};reader.readAsText(file,'utf-8')};})();
</script>
</body>
</html>
