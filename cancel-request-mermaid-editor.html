<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单取消流程图</title><link rel="stylesheet" href="flow-shell.css"><style>
body{background:#050505}.canvas{width:1835px;height:1940px;min-width:1835px;background:#fff}.source{display:block;width:1835px;height:1940px}.hit{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer}.hit:hover,.hit:focus-visible{outline:3px solid #52a9f2;outline-offset:2px}.edit-label{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:4px 7px;color:#151515;background:#f2f2ff;border:1px solid #aaa;font:14px/1.3 "Microsoft YaHei",Arial,sans-serif;white-space:pre-line}.edit-label.decision{transform:rotate(45deg);background:#f5f3ff}.edit-label.decision span{transform:rotate(-45deg);display:block;max-width:90px;font-size:12px}.editor p{line-height:1.5}.original{font-size:11px;color:#657282;white-space:pre-line;background:#f3f6f9;padding:7px;border:1px solid #d6dee7}.toolbar .pdf{background:#1f5e96;border-color:#1f5e96}@media print{header,.editor{display:none!important}body{background:#fff}.canvas{margin:0;transform:none}.source{width:1835px;height:1940px}.hit{display:none}}
</style></head><body data-storage-key="cancel-request-image-style-edits-v1"><header><h1>订单取消流程图</h1><span class="sub">原图不作任何改动；点击原图节点后可仅编辑该节点文字。导出 PDF 会保留原始版式。</span><a class="back" href="index.html">返回总 SOP</a><div class="toolbar"><button id="pdfButton" class="pdf">导出 PDF</button><button id="exportButton">导出 JSON</button><label class="file-button">导入 JSON<input id="importInput" type="file" accept="application/json"></label><button id="resetButton">重置</button><span class="status" id="saveStatus">尚未修改</span></div></header><main class="canvas" id="canvas"><img class="source" src="cancel-request-source.png" alt="订单取消流程图原图"><!-- Transparent click targets retain the original image until a user saves an edit. -->
<button class="hit" data-node="start" data-text="客户发起取消请求" style="left:830px;top:5px;width:155px;height:38px"></button><button class="hit" data-node="status" data-text="订单当前状态判断&#10;（以系统状态为准，勿凭客户主观判断）" style="left:780px;top:70px;width:185px;height:185px"></button><button class="hit" data-node="pending-sla" data-text="24小时内确认处理&#10;Kohl's要求响应时效" style="left:125px;top:875px;width:180px;height:76px"></button><button class="hit" data-node="label-created" data-text="是否已生成物流标签?" style="left:125px;top:1020px;width:145px;height:145px"></button><button class="hit" data-node="cancel-direct" data-text="直接取消订单&#10;后台标记 Cancelled" style="left:0;top:1365px;width:190px;height:72px"></button><button class="hit" data-node="void-label" data-text="作废标签 + 拦截包裹&#10;确认未扫描出库后取消" style="left:235px;top:1365px;width:210px;height:72px"></button><button class="hit" data-node="inventory" data-text="释放库存回可售数量" style="left:130px;top:1565px;width:170px;height:60px"></button><button class="hit" data-node="reason" data-text="客户要求取消原因" style="left:695px;top:430px;width:140px;height:140px"></button><button class="hit" data-node="cannot-stop" data-text="告知无法拦截&#10;引导走拒收或30天退货流程" style="left:650px;top:700px;width:210px;height:75px"></button><button class="hit" data-node="return-method" data-text="拒收：包裹自动退回&#10;退货：门店退回 / 直营网点" style="left:650px;top:875px;width:210px;height:75px"></button><button class="hit" data-node="inspection" data-text="到仓验收&#10;商品完好? 配件齐全?" style="left:690px;top:1015px;width:150px;height:150px"></button><button class="hit" data-node="refund-check" data-text="核对退款金额&#10;⚠ Kohl's Cash抵扣部分需扣除" style="left:490px;top:1365px;width:200px;height:70px"></button><button class="hit" data-node="evidence" data-text="拍照留证 → 提交证据申诉&#10;部分退款或拒绝退款" style="left:765px;top:1365px;width:205px;height:70px"></button><button class="hit" data-node="order-update" data-text="更新订单状态 + 释放 / 报损库存" style="left:645px;top:1565px;width:210px;height:60px"></button><button class="hit" data-node="carrier-check" data-text="查 GLS / 承运商轨迹&#10;超过5个工作日未更新异常" style="left:1080px;top:875px;width:210px;height:75px"></button><button class="hit" data-node="case" data-text="向承运商开Case索赔&#10;留存轨迹截图为证" style="left:1125px;top:1015px;width:145px;height:150px"></button><button class="hit" data-node="platform-rule" data-text="⚠ 平台规则：客户指标未收到&#10;即使有签收记录也优先退款" style="left:1070px;top:1365px;width:220px;height:70px"></button><button class="hit" data-node="refund-resend" data-text="先给客户退款 / 补发&#10;再与承运商理赔" style="left:1080px;top:1510px;width:205px;height:70px"></button><button class="hit" data-node="window" data-text="是否已过免取消窗口?" style="left:1530px;top:1300px;width:145px;height:145px"></button><button class="hit" data-node="sync-stock" data-text="同意取消 → 同步库存" style="left:1410px;top:1565px;width:175px;height:60px"></button><button class="hit" data-node="ship-normal" data-text="包裹照常派送&#10;通知客户可退回原包裹" style="left:1645px;top:1565px;width:185px;height:60px"></button><button class="hit" data-node="ledger" data-text="记录台账 → 关闭工单" style="left:1125px;top:1690px;width:185px;height:60px"></button><button class="hit" data-node="monthly" data-text="月度复盘看板" style="left:1130px;top:1800px;width:175px;height:55px"></button><button class="hit" data-node="cancel-rate" data-text="⚠ 取消率监控&#10;高于3%账户可能被暂停 / 立案" style="left:825px;top:1880px;width:225px;height:60px"></button><button class="hit" data-node="top-analysis" data-text="取消原因TOP分析&#10;→ 反向销售品类 / 选品" style="left:1110px;top:1880px;width:205px;height:60px"></button><button class="hit" data-node="reconcile" data-text="退款差异对账&#10;Kohl's Cash扣减核对发票" style="left:1380px;top:1880px;width:205px;height:60px"></button></main><aside class="editor" id="editor" hidden><h2>编辑节点</h2><p>保存后仅覆盖当前节点文字；重置可恢复为完全原始的 PNG 流程图。</p><label>原始文字</label><div id="original" class="original"></div><label for="nodeText">节点文字</label><textarea id="nodeText" maxlength="300"></textarea><div class="actions"><button id="cancel">取消</button><button class="save" id="save">保存</button></div></aside><script>
(()=>{const key=document.body.dataset.storageKey,hits=[...document.querySelectorAll('.hit')],canvas=document.querySelector('#canvas'),box=document.querySelector('#editor'),input=document.querySelector('#nodeText'),original=document.querySelector('#original'),status=document.querySelector('#saveStatus');let selected,edits={};try{edits=JSON.parse(localStorage.getItem(key))||{}}catch{}const clean=t=>t.replace(/&#10;/g,'\n');function placement(hit,text){const existing=canvas.querySelector('[data-overlay="'+hit.dataset.node+'"]');if(existing)existing.remove();if(!text)return;const r=hit.getBoundingClientRect(),c=canvas.getBoundingClientRect(),el=document.createElement('div');el.dataset.overlay=hit.dataset.node;el.className='edit-label'+(hit.dataset.node==='status'||hit.dataset.node==='reason'||hit.dataset.node==='label-created'||hit.dataset.node==='inspection'||hit.dataset.node==='case'||hit.dataset.node==='window'?' decision':'');el.style.left=(r.left-c.left)+'px';el.style.top=(r.top-c.top)+'px';el.style.width=r.width+'px';el.style.height=r.height+'px';const span=document.createElement('span');span.textContent=text;el.append(span);canvas.append(el)}function apply(){hits.forEach(h=>placement(h,edits[h.dataset.node]))}apply();hits.forEach(h=>{h.setAttribute('aria-label',clean(h.dataset.text));h.onclick=()=>{selected=h;original.textContent=clean(h.dataset.text);input.value=edits[h.dataset.node]||clean(h.dataset.text);box.hidden=false;input.focus()}});document.querySelector('#cancel').onclick=()=>{selected=null;box.hidden=true};document.querySelector('#save').onclick=()=>{if(!selected||!input.value.trim())return;edits[selected.dataset.node]=input.value.trim();localStorage.setItem(key,JSON.stringify(edits));placement(selected,edits[selected.dataset.node]);status.textContent='已自动保存';box.hidden=true};document.querySelector('#resetButton').onclick=()=>{if(confirm('确认清除本地文字修改并恢复原始 PNG？')){localStorage.removeItem(key);location.reload()}};document.querySelector('#exportButton').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,edits},null,2)],{type:'application/json'}));a.download='订单取消流程图-文字修改.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#importInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x.edits!=='object'||Array.isArray(x.edits))throw Error();localStorage.setItem(key,JSON.stringify(x.edits));location.reload()}catch{alert('无法读取此 JSON 文件。')}e.target.value=''};r.readAsText(f,'utf-8')};document.querySelector('#pdfButton').onclick=()=>window.print()})();
</script></body></html>
